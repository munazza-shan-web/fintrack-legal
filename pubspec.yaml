
name: fintrack
description: "Save Goals - Free savings goal tracker by AILANGA SCHOOL PROJECT"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  # Daily notifications
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/save_goals_icon.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/save_goals_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#9FE870"
  adaptive_icon_foreground: "assets/branding/save_goals_adaptive.png"
  remove_alpha_ios: true
